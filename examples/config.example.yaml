# 示例：填写私人的节点文件及随机密钥，核对网关与规则数据路径后才能部署。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 192.168.0.1:9999
external-ui: ui
secret: REPLACE_WITH_RANDOM_SECRET_BEFORE_USE
routing-mark: 7894
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: false
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.lan
  - +.local
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.0/8
  fake-ip-filter:
  - +.lan
  - +.local
  - +.miwifi.com
  - +.ntp.org
  - time.*.com
  - rule-set:cn
  - +.yjwujian.cn
  - +.narakathegame.com
  - +.narakabladepoint.com
  - +.neteasegames.com
  - +.netease.com
  - +.netease.im
  - +.easebar.com
  - +.163.com
  - +.126.net
  - +.127.net
  - +.nease.net
  - +.static163.net
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    rule-set:cn:
    - 223.5.5.5
    - 119.29.29.29
    +.cn:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
proxy-providers:
  机场订阅:
    type: file
    path: ./providers/subscription.yaml
    health-check:
      enable: false
proxy-groups:
- name: 代理
  type: select
  proxies:
  - 自动选择
  use:
  - 机场订阅
- name: 自动选择
  type: url-test
  use:
  - 机场订阅
  filter: ^(HK|JP|US) 01$
  url: https://www.gstatic.com/generate_204
  interval: 900
  tolerance: 50
  lazy: true
- name: AI 美国
  type: select
  use:
  - 机场订阅
  filter: '^US '
rule-providers:
  cn:
    type: file
    behavior: domain
    format: mrs
    path: ./ruleset/cn.mrs
rules:
- DOMAIN-SUFFIX,yjwujian.cn,DIRECT
- DOMAIN-SUFFIX,narakathegame.com,DIRECT
- DOMAIN-SUFFIX,narakabladepoint.com,DIRECT
- DOMAIN-SUFFIX,neteasegames.com,DIRECT
